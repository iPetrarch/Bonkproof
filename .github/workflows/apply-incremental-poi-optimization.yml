name: Apply incremental POI optimization

on:
  push:
    branches:
      - chatgpt/finish-incremental-poi-categories
    paths:
      - scripts/apply-incremental-poi-optimization.py
      - scripts/update-incremental-poi-regression-tests.py
      - .github/workflows/apply-incremental-poi-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/finish-incremental-poi-categories
          persist-credentials: false

      - name: Apply focused source changes
        run: |
          python scripts/apply-incremental-poi-optimization.py
          python scripts/update-incremental-poi-regression-tests.py

      - name: Run regression tests
        shell: bash
        run: |
          set -o pipefail
          node --test 2>&1 | tee incremental-poi-test-output.txt

      - name: Upload regression test output
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: incremental-poi-test-output
          path: incremental-poi-test-output.txt
          if-no-files-found: warn

      - name: Verify generated diff
        run: |
          git status --short
          git diff --check
          test -f tests/incremental-poi-loading.test.mjs
          git diff -- app.js docs/overture-local.md tests/dynamic-poi-ui.test.mjs tests/ui-regressions.test.mjs tests/incremental-poi-loading.test.mjs

      - name: Commit productive changes only
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add app.js docs/overture-local.md tests/dynamic-poi-ui.test.mjs tests/ui-regressions.test.mjs tests/incremental-poi-loading.test.mjs
          git diff --cached --check
          git commit -m 'Optimize incremental local POI loading'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:chatgpt/finish-incremental-poi-categories
