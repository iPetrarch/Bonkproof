name: Apply incremental POI optimization

on:
  push:
    branches:
      - chatgpt/finish-incremental-poi-categories
    paths:
      - scripts/apply-incremental-poi-optimization.py
      - .github/workflows/apply-incremental-poi-optimization.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - name: Check out branch
        uses: actions/checkout@v4
        with:
          ref: chatgpt/finish-incremental-poi-categories
          persist-credentials: false

      - name: Apply focused source changes
        run: python scripts/apply-incremental-poi-optimization.py

      - name: Run regression tests
        run: node --test

      - name: Verify generated diff
        run: |
          git status --short
          git diff --check
          test -f tests/incremental-poi-loading.test.mjs
          git diff -- app.js docs/overture-local.md tests/incremental-poi-loading.test.mjs

      - name: Remove temporary helper files
        run: |
          rm scripts/apply-incremental-poi-optimization.py
          rm .github/workflows/apply-incremental-poi-optimization.yml

      - name: Commit focused changes
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --check
          git commit -m 'Optimize incremental local POI loading'
          git remote set-url origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          git push origin HEAD:chatgpt/finish-incremental-poi-categories

# retrigger after helper whitespace fix
