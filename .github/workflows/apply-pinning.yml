name: Apply pinning patch

on:
  push:
    branches:
      - chatgpt/pinned-pois

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - run: python tools/apply-pinning-patch.py
      - run: |
          if git diff --quiet -- app.js styles.css tests/pinned-pois.test.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app.js styles.css tests/pinned-pois.test.mjs
          git commit -m "Add pinned POI preservation"
          git push origin HEAD:chatgpt/pinned-pois
