name: Deploy Bonkproof

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: bonkproof-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: npm test

      - name: Install WinSCP
        shell: pwsh
        run: choco install winscp -y --no-progress

      - name: Validate WinSCP installation
        shell: pwsh
        run: |
          $assembly = 'C:\Program Files (x86)\WinSCP\netstandard2.0\WinSCPnet.dll'
          $exe = 'C:\Program Files (x86)\WinSCP\WinSCP.exe'
          if (-not (Test-Path -LiteralPath $assembly)) {
            throw "WinSCP .NET Standard assembly not found at '$assembly'."
          }
          if (-not (Test-Path -LiteralPath $exe)) {
            throw "WinSCP executable not found at '$exe'."
          }

      - name: Validate deployment secrets
        shell: pwsh
        env:
          BONKPROOF_SFTP_PASSWORD: ${{ secrets.BONKPROOF_SFTP_PASSWORD }}
          BONKPROOF_SFTP_HOSTKEY: ${{ secrets.BONKPROOF_SFTP_HOSTKEY }}
        run: |
          foreach ($name in @('BONKPROOF_SFTP_PASSWORD', 'BONKPROOF_SFTP_HOSTKEY')) {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Required GitHub Actions secret '$name' is missing."
            }
          }

      - name: Deploy to production
        shell: pwsh
        env:
          BONKPROOF_SFTP_PASSWORD: ${{ secrets.BONKPROOF_SFTP_PASSWORD }}
          BONKPROOF_SFTP_HOSTKEY: ${{ secrets.BONKPROOF_SFTP_HOSTKEY }}
        run: |
          @'
          @{
              HostName = 'ssh.petrarch.de'
              PortNumber = 22
              UserName = 'petrarch.de'
              RemotePath = '/customers/e/4/0/petrarch.de/httpd.www/bonkproof'
              SshHostKeyFingerprint = $env:BONKPROOF_SFTP_HOSTKEY
              PasswordEnvironmentVariable = 'BONKPROOF_SFTP_PASSWORD'
              WinScpAssemblyPath = 'C:\Program Files (x86)\WinSCP\netstandard2.0\WinSCPnet.dll'
              WinScpExecutablePath = 'C:\Program Files (x86)\WinSCP\WinSCP.exe'
          }
          '@ | Set-Content -LiteralPath '.\deploy.home.local.ps1' -Encoding UTF8

          .\deploy.ps1 -Profile home -Force

      - name: Remove temporary deployment files
        if: always()
        shell: pwsh
        run: |
          Remove-Item '.\deploy.home.local.ps1' -Force -ErrorAction SilentlyContinue
          Remove-Item '.\.deploy-state.home.json' -Force -ErrorAction SilentlyContinue
