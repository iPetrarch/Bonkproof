name: Tests

on:
  push:
    branches:
      - main
      - 'chatgpt/**'
  pull_request:
    branches:
      - main

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Update pinning regression on development branch
        if: github.ref == 'refs/heads/chatgpt/pinned-pois' && github.actor != 'github-actions[bot]'
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('tests/ui-regressions.test.mjs')
          text = p.read_text()
          old = "  assert.match(app, /const deduped = new Map\\(\\(retryFailedOnly \\? currentPois : \\[\\]\\)/);"
          new = "  assert.match(app, /const pinnedFallbacks = \\[\\.\\.\\.pinnedPoiSnapshots\\.entries\\(\\)\\]/);\n  assert.match(app, /const deduped = new Map\\(\\[\\.\\.\\.\\(retryFailedOnly \\? currentPois : \\[\\]\\)\\.map/);"
          if old not in text:
              raise SystemExit('Expected old retry dedupe assertion not found')
          p.write_text(text.replace(old, new, 1))
          PY
          if git diff --quiet -- tests/ui-regressions.test.mjs; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add tests/ui-regressions.test.mjs
          git commit -m "Update retry regression for pinned fallbacks"
          git push origin HEAD:chatgpt/pinned-pois

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run regression tests
        run: npm test
